apiVersion: gdsi.socioprophet.org/v0
kind: CompetitiveLandscape
metadata:
  id: devsecops-paas-agentic-landscape
  version: 0.1.0
  status: draft
  researched_at: "2026-08-03"
  benchmark_target: "SourceOS/Prophet continuum (sourceos-continuum + prophet-platform)"
spec:
  our_position:
    maturity_stage: experimental
    summary: >-
      Sovereign, local-first PaaS + autonomous DevSecOps continuum: detect stale vendored deps
      -> typed EffectRequest -> fail-closed policy membrane -> digest-pinned re-vendor (own zot
      registry, sha256-verified) -> JIT scale-to-zero LLM re-review (sealed APPROVE/REJECT/
      NEEDS_HUMAN) -> fail-closed promotion gate -> hash-sealed receipts on every action.
      Self-hosted (Gitea, zot, own runners). Several lifecycle stages are scaffolds.
    distinctive_claims:   # recorded for balance; EXCLUDED from the gap register by construction
      - "Fail-closed gates + hash-sealed per-action receipts as a hard promote-or-it-doesn't invariant"
      - "Independent sealed-verdict LLM review as a separate governance authority (not advisory comments)"
      - "Version-marker attestation: the packed dist really is the release it claims"
      - "Fully self-hosted / no external SaaS (Gitea + zot + own runners)"
      - "Receipt-sealed autonomous re-vendor executor with digest verification"

